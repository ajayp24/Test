t-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">Least privilege; encrypt;</text><text x="284" y="133" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">trace every action</text><rect x="506" y="48" width="222" height="108" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="518" y="70" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Reliability</text><text x="522" y="94" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#5f6881">Recover and scale</text><text x="522" y="118" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">Test recovery; avoid single</text><text x="522" y="133" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">points of failure</text><rect x="30" y="172" width="222" height="108" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="42" y="194" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Performance Efficiency</text><text x="46" y="218" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#5f6881">Use resources well</text><text x="46" y="242" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">Managed and serverless</text><text x="46" y="257" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">services; go global</text><rect x="268" y="172" width="222" height="108" rx="8" fill="#F4F7FF" st