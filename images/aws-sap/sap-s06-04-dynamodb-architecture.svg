<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 586 493" width="586" height="493" role="img" aria-label="DynamoDB architecture"><rect width="586" height="493" rx="12" fill="#ffffff"/><rect x="14" y="14" width="558" height="465" rx="8" fill="none" stroke="#8C4FFF" stroke-width="1.6"/><g transform="translate(22 20) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#8C4FFF"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 35H34A7.5 7.5 0 0 0 33 20A10 10 0 0 0 15 22A6.5 6.5 0 0 0 15 35Z"/></g></g><text x="50" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#8C4FFF">TABLE: Orders</text><rect x="137" y="48" width="312" height="162" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="149" y="70" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Item schema</text><rect x="153" y="82" width="280" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="293" y="102" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Partition key: OrderId (required)</text><rect x="153" y="122" width="280" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="293" y="142" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Sort key: CustomerId (optional)</text><rect x="153" y="162" width="280" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="293" y="182" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Attributes: Status, Amount, Date, ...</text><rect x="30" y="232" width="526" height="161" rx="8" fill="none" stroke="#9AA5B5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="42" y="254" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#5f6881">Physical storage</text><rect x="46" y="305.5" width="96" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="94" y="325.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Item</text><rect x="170" y="305.5" width="152" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="246" y="325.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Hash(partition key)</text><g transform="translate(421 266) scale(1)"><rect width="48" height="48" rx="5" fill="#C925D1"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="12" width="30" height="24"/><path d="M9 20H39M9 28H39M19 12V36"/></g></g><text x="445" y="333" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">Storage partition</text><text x="445" y="348" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">splits above 10 GB</text><text x="445" y="361" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">or 3000 RCU / 1000</text><text x="445" y="374" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">WCU</text><rect x="39" y="415" width="240" height="48" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="159" y="435" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">PROVISIONED</text><text x="159" y="451" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Set RCU/WCU, auto-scaling possible</text><rect x="307" y="415" width="240" height="48" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="427" y="435" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">ON-DEMAND</text><text x="427" y="451" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Pay per request, instant scale</text><path d="M142.0 321.5L170.0 321.5" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M170 321.5L162 317L162 326Z" fill="#5f6881"/><path d="M322.0 321.5L371.5 321.5L371.5 290.0L421.0 290.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M421 290L413 285.5L413 294.5Z" fill="#5f6881"/></svg>
