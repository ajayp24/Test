<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 371" width="1140" height="371" role="img" aria-label="The 7 Rs of migration"><rect width="1140" height="371" rx="12" fill="#ffffff"/><rect x="14" y="14" width="1111.6" height="342.5" rx="8" fill="none" stroke="#232F3E" stroke-width="1.6"/><g transform="translate(22 20) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#232F3E"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 35H34A7.5 7.5 0 0 0 33 20A10 10 0 0 0 15 22A6.5 6.5 0 0 0 15 35Z"/></g></g><text x="50" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#232F3E">The 7 Rs of migration</text><rect x="39.2" y="55.75" width="232" height="116" rx="8" fill="none" stroke="#9AA5B5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="51.2" y="77.75" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#5f6881">1. RETIRE</text><text x="55.2" y="101.75" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Decommission. No migration</text><text x="55.2" y="117.25" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">needed. ~10–20% of the</text><text x="55.2" y="132.75" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">portfolio.</text><text x="55.2" y="148.25" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"This app is no longer used."</text><rect x="300" y="55.75" width="232" height="116" rx="8" fill="none" stroke="#9AA5B5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="312" y="77.75" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#5f6881">2. RETAIN</text><text x="316" y="101.75" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Keep on-premises for now: too</text><text x="316" y="117.25" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">complex, compliance, not</text><text x="316" y="132.75" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">migrating yet.</text><text x="316" y="148.25" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"We'll revisit in 2 years."</text><rect x="571.6" y="63.5" width="232" height="100.5" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="583.6" y="85.5" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">3. REHOST (lift &amp; shift)</text><text x="587.6" y="109.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Move to EC2 without changes.</text><text x="587.6" y="125" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Fast, low risk. Use AWS MGN.</text><text x="587.6" y="140.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"Move as-is to AWS EC2."</text><rect x="837.6" y="48" width="272" height="131.5" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="849.6" y="70" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">4. REPLATFORM (move &amp; improve)</text><text x="873.6" y="94" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Lift, tinker, shift. e.g.</text><text x="873.6" y="109.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Oracle DB → RDS, app server →</text><text x="873.6" y="125" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Elastic Beanstalk.</text><text x="873.6" y="140.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"Managed database but same</text><text x="873.6" y="156" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">app."</text><rect x="30" y="209" width="250.4" height="116" rx="8" fill="#FFF7EE" stroke="#ED7100" stroke-width="1.6"/><text x="42" y="231" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ED7100">5. REPURCHASE (drop &amp; shop)</text><text x="55.2" y="255" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Move to SaaS. e.g. CRM →</text><text x="55.2" y="270.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Salesforce, email → MS365, HR</text><text x="55.2" y="286" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">→ Workday.</text><text x="55.2" y="301.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"Buy instead of migrate."</text><rect x="294.4" y="193.5" width="243.20000000000002" height="147" rx="8" fill="#FFF7EE" stroke="#ED7100" stroke-width="1.6"/><text x="306.4" y="215.5" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ED7100">6. REFACTOR (re-architect)</text><text x="316" y="239.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Cloud-native redesign:</text><text x="316" y="255" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">monolith → microservices +</text><text x="316" y="270.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Lambda. Most expensive,</text><text x="316" y="286" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">highest ROI.</text><text x="316" y="301.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"Rebuild using cloud-native</text><text x="316" y="317" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">services."</text><rect x="551.6" y="201.25" width="272" height="131.5" rx="8" fill="#F1F9F1" stroke="#2E8B2E" stroke-width="1.6"/><text x="563.6" y="223.25" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2E8B2E">7. RELOCATE (hypervisor level)</text><text x="587.6" y="247.25" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Move to the cloud without</text><text x="587.6" y="262.75" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">changes using VMware Cloud on</text><text x="587.6" y="278.25" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">AWS.</text><text x="587.6" y="293.75" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"VMware vMotion to AWS VMware</text><text x="587.6" y="309.25" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Cloud."</text></svg>
