-serif;font-size:10px;fill:#5f6881">AZ-b · &lt; 10 ms lag</text><g transform="translate(342 48) scale(1)"><rect width="48" height="48" rx="5" fill="#C925D1"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="14" rx="12" ry="4.5"/><path d="M12 14V34C12 37 17 39 24 39S36 37 36 34V14M12 24C12 27 17 29 24 29S36 27 36 24"/></g></g><text x="366" y="115" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">Replica 2 (RO)</text><text x="366" y="130" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">AZ-c · &lt; 10 ms lag</text><rect x="30" y="155" width="392" height="114" rx="8" fill="#F2F6E8" stroke="#7AA116" stroke-width="1.6"/><g transform="translate(38 161) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#7AA116"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="22" width="22" height="15" rx="2"/><path d="M17.5 22V17.5a6.5 6.5 0 0 1 13 0V22"/></g></g><text x="66" y="177" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#7AA116">Aurora shared storage volume</text><rect x="46" y="189" width="360" height="64" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="226" y="209" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">6 copies across 3 AZs (2 per AZ) · auto-heals corrupt</text><text x="226" y="225" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">data</text><text x="226" y="241" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">10 GB chunks · auto-scales to 128 TB</text><rect x