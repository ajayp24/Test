<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 829" width="831" height="829" role="img" aria-label="Common SAP-C02 traps and distractors"><rect width="831" height="829" rx="12" fill="#ffffff"/><rect x="14" y="14" width="802.4000000000001" height="801" rx="8" fill="none" stroke="#232F3E" stroke-width="1.6"/><g transform="translate(22 20) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#232F3E"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 35H34A7.5 7.5 0 0 0 33 20A10 10 0 0 0 15 22A6.5 6.5 0 0 0 15 35Z"/></g></g><text x="50" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#232F3E">Common SAP-C02 traps and distractors</text><rect x="30" y="48" width="362" height="133" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="42" y="70" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 1: "Multi-AZ for DR across regions"</text><rect x="46" y="82" width="330" height="46" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="211" y="101" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: Multi-AZ protects against AZ failure, NOT</text><text x="211" y="116" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Region failure</text><rect x="46" y="134" width="330" height="31" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="211" y="153" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: Need multi-Region for regional DR</text><rect x="422.20000000000005" y="48" width="362" height="133" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="434.20000000000005" y="70" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 2: "Read Replica for HA"</text><rect x="438.20000000000005" y="82" width="330" height="31" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="603.2" y="101" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: Read replica ≠ HA (no automatic failover)</text><rect x="438.20000000000005" y="119" width="330" height="46" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="603.2" y="138" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: RDS Multi-AZ for HA; read replica for</text><text x="603.2" y="153" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">read scaling</text><rect x="30" y="195" width="362" height="133" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="42" y="217" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 3: "SCP grants permissions"</text><rect x="46" y="229" width="330" height="31" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="211" y="248" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: SCPs only RESTRICT, never GRANT</text><rect x="46" y="266" width="330" height="46" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="211" y="285" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: IAM policies grant; SCPs limit the</text><text x="211" y="300" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">maximum</text><rect x="413.20000000000005" y="195" width="380" height="133" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="425.20000000000005" y="217" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 4: "Management account affected by SCPs"</text><rect x="438.20000000000005" y="229" width="330" height="46" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="603.2" y="248" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: The management account is EXEMPT from</text><text x="603.2" y="263" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">SCPs</text><rect x="438.20000000000005" y="281" width="330" height="31" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="603.2" y="300" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: SCPs apply only to member accounts</text><rect x="30" y="342" width="362" height="133" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="42" y="364" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 5: "NAT Gateway for S3 access"</text><rect x="46" y="376" width="330" height="46" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="211" y="395" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: Use a gateway endpoint (free!) for S3</text><text x="211" y="410" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">from a private subnet</text><rect x="46" y="428" width="330" height="31" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="211" y="447" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: Gateway endpoint → route table entry → S3</text><rect x="422.20000000000005" y="342" width="362" height="133" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="434.20000000000005" y="364" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 6: "DMS converts schema"</text><rect x="438.20000000000005" y="376" width="330" height="31" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="603.2" y="395" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: DMS moves DATA; SCT converts SCHEMA</text><rect x="438.20000000000005" y="413" width="330" height="46" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="603.2" y="432" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: Heterogeneous migration = DMS + SCT both</text><text x="603.2" y="447" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">needed</text><rect x="30" y="504" width="362" height="118" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="42" y="526" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 7: "CloudFront for TCP/UDP gaming"</text><rect x="46" y="538" width="330" height="31" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="211" y="557" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: CloudFront = HTTP/HTTPS only</text><rect x="46" y="575" width="330" height="31" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="211" y="594" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: Global Accelerator for TCP/UDP protocols</text><rect x="406" y="489" width="394.40000000000003" height="148" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="418" y="511" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 8: "Instance Store for persistent storage"</text><rect x="438.20000000000005" y="523" width="330" height="46" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="603.2" y="542" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: Instance Store is EPHEMERAL (lost when</text><text x="603.2" y="557" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">the instance stops)</text><rect x="438.20000000000005" y="575" width="330" height="46" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="603.2" y="594" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: EBS for persistence; Instance Store for</text><text x="603.2" y="609" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">temp cache only</text><rect x="30" y="651" width="362" height="148" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="42" y="673" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 9: "S3 is a global service"</text><rect x="46" y="685" width="330" height="46" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="211" y="704" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: Bucket names are globally unique BUT</text><text x="211" y="719" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">buckets are REGIONAL</text><rect x="46" y="737" width="330" height="46" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="211" y="756" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: Data doesn't replicate globally unless</text><text x="211" y="771" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">CRR is configured</text><rect x="422.20000000000005" y="651" width="362" height="148" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="434.20000000000005" y="673" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">TRAP 10: "Spot Instances for databases"</text><rect x="438.20000000000005" y="685" width="330" height="46" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="603.2" y="704" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Reality: Spot can be interrupted: terrible for</text><text x="603.2" y="719" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">databases</text><rect x="438.20000000000005" y="737" width="330" height="46" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="603.2" y="756" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">Correct: Spot for batch/stateless;</text><text x="603.2" y="771" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#1a1f36">On-Demand/Reserved for DBs</text></svg>
