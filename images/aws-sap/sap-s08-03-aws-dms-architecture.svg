<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 300" width="864" height="300" role="img" aria-label="AWS DMS architecture"><rect width="864" height="300" rx="12" fill="#ffffff"/><rect x="14" y="20" width="202" height="118" rx="8" fill="#F7F8FA" stroke="#5A6C86" stroke-width="1.6"/><g transform="translate(22 26) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#5A6C86"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="9" width="26" height="30"/><path d="M17 16H21M27 16H31M17 23H21M27 23H31M17 30H21M27 30H31"/></g></g><text x="50" y="42" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#5A6C86">Source DB</text><text x="30" y="66" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Oracle, MySQL, SQL</text><text x="30" y="82" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Server,</text><text x="30" y="98" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">PostgreSQL, MongoDB,</text><text x="30" y="114" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Cassandra, S3, etc.</text><rect x="244" y="14" width="396" height="130" rx="8" fill="none" stroke="#8C4FFF" stroke-width="1.6"/><g transform="translate(252 20) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#8C4FFF"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 35H34A7.5 7.5 0 0 0 33 20A10 10 0 0 0 15 22A6.5 6.5 0 0 0 15 35Z"/></g></g><text x="280" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#8C4FFF">DMS replication instance (EC2 in your VPC)</text><g transform="translate(292 52) scale(1)"><rect width="48" height="48" rx="5" fill="#01A88D"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="15" rx="7" ry="3"/><path d="M7 15V28C7 30 10 31.5 14 31.5S21 30 21 28V15"/><ellipse cx="34" cy="26" rx="7" ry="3"/><path d="M27 26V36C27 38 30 39.5 34 39.5S41 38 41 36V26M20 22H30M27 19L30 22L27 25"/></g></g><text x="316" y="119" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">AWS DMS</text><rect x="394" y="48" width="230" height="80" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="509" y="68" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">DMS tasks</text><text x="509" y="84" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">1. Full load: copy all existing</text><text x="509" y="100" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">data</text><text x="509" y="116" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">2. CDC: capture ongoing changes</text><rect x="668" y="36" width="182" height="86" rx="8" fill="none" stroke="#9AA5B5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="680" y="58" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#5f6881">Target DB</text><text x="684" y="82" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">RDS, Aurora, DynamoDB,</text><text x="684" y="98" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Redshift, S3</text><rect x="169" y="164" width="526" height="122" rx="8" fill="#FFF7EE" stroke="#ED7100" stroke-width="1.6"/><text x="181" y="186" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ED7100">Schema Conversion Tool (SCT)</text><g transform="translate(217 198) scale(1)"><rect width="48" height="48" rx="5" fill="#01A88D"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="15" rx="7" ry="3"/><path d="M7 15V28C7 30 10 31.5 14 31.5S21 30 21 28V15"/><ellipse cx="34" cy="26" rx="7" ry="3"/><path d="M27 26V36C27 38 30 39.5 34 39.5S41 38 41 36V26M20 22H30M27 19L30 22L27 25"/></g></g><text x="241" y="265" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">AWS SCT</text><text x="319" y="220" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Converts schema from one DB engine to another (Oracle</text><text x="319" y="236" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">→ PostgreSQL, SQL Server → Aurora). Generates an</text><text x="319" y="252" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">assessment report on conversion complexity.</text><path d="M216.0 79.0L244.0 79.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M244 79L236 74.5L236 83.5Z" fill="#5f6881"/><path d="M640.0 79.0L668.0 79.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M668 79L660 74.5L660 83.5Z" fill="#5f6881"/></svg>
