. Restore from snapshot 2. Launch EC2 from AMI</text><text x="502" y="259" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">3. Restore RDS from snapshot 4. Update DNS (Route 53)</text><rect x="14" y="326" width="260" height="32" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="144" y="346" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Cost: LOWEST (only pay for storage)</text><rect x="302" y="326" width="266" height="32" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="435" y="346" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">RTO: hours (24+ hours for large DBs)</text><rect x="596" y="326" width="260" height="32" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="726" y="346" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">RPO: hours (time since last backup)</text><path d="M319.0 72.0L430.0 72.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M430 72L422 67.5L422 76.5Z" fill="#5f6881"/><path d="M478.0 72.5L524.0 72.5L524.0 79.0L570.0 79.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M570 79L562 74.5L562 83.5Z" fill="#5f6881"/><path d="M435.0 150.0L435.0 170.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M435 170L430.5 162L439.5 162Z" fill="#5f6881"/><rect x="380.7" y="151.0" width="108.6" height="18" rx="4" fill="#fff" opacity=".94"/><text x="435.0" y="162.0" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10.5px;font-weight:600;fill:#3c4660">Cross-region copy</text></svg>
