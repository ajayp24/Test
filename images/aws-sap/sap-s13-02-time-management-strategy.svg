<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 883 379" width="883" height="379" role="img" aria-label="Time management strategy"><rect width="883" height="379" rx="12" fill="#ffffff"/><rect x="305.4" y="14" width="272" height="50" rx="6" fill="#232F3E" stroke="#232F3E" stroke-width="1.5"/><text x="441.4" y="35" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:13px;font-weight:700;fill:#fff">180 minutes for 75 questions = 2.4</text><text x="441.4" y="52" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:13px;font-weight:700;fill:#fff">minutes per question</text><rect x="14" y="84" width="262" height="147" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="26" y="106" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Phase 1: FIRST PASS (90 min)</text><text x="30" y="130" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Answer questions you know</text><text x="30" y="145.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">confidently</text><text x="30" y="161" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Mark uncertain / complex questions</text><text x="30" y="176.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">for review</text><text x="30" y="192" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Skip long calculations (come back)</text><text x="30" y="207.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Target: 60+ questions answered</text><rect x="304" y="84" width="264.8" height="147" rx="8" fill="#FFF7EE" stroke="#ED7100" stroke-width="1.6"/><text x="316" y="106" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ED7100">Phase 2: REVIEW PASS (60 min)</text><text x="321.4" y="130" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Revisit flagged questions</text><text x="321.4" y="145.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Re-read carefully for missed</text><text x="321.4" y="161" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">details</text><text x="321.4" y="176.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Use elimination for 50/50 choices</text><text x="321.4" y="192" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Answer ALL: no penalty for</text><text x="321.4" y="207.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">guessing</text><rect x="596.8" y="84" width="272" height="131.5" rx="8" fill="#F1F9F1" stroke="#2E8B2E" stroke-width="1.6"/><text x="608.8" y="106" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2E8B2E">Phase 3: FINAL REVIEW (30 min)</text><text x="617.8" y="130" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Check all unanswered questions</text><text x="617.8" y="145.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Verify multiple-response questions</text><text x="617.8" y="161" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">have the right count</text><text x="617.8" y="176.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Trust your first instinct unless</text><text x="617.8" y="192" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">certain</text><rect x="156.89999999999998" y="251" width="569" height="114" rx="8" fill="none" stroke="#9AA5B5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="168.89999999999998" y="273" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#5f6881">Question time budget</text><rect x="172.89999999999998" y="293" width="132" height="48" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="238.89999999999998" y="313" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">Simple knowledge</text><text x="238.89999999999998" y="329" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">1–1.5 minutes</text><rect x="332.9" y="293" width="119" height="48" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="392.4" y="313" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">Scenario-based</text><text x="392.4" y="329" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">2–3 minutes</text><rect x="479.9" y="285" width="230" height="64" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="594.9" y="305" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">Complex architecture</text><text x="594.9" y="321" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">3–4 minutes (flag and return if</text><text x="594.9" y="337" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">needed)</text><path d="M276.0 157.5L304.0 157.5" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M304 157.5L296 153L296 162Z" fill="#5f6881"/><path d="M568.8 157.5L582.8 157.5L582.8 149.8L596.8 149.8" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M596.8 149.75L588.8 145.25L588.8 154.25Z" fill="#5f6881"/></svg>
