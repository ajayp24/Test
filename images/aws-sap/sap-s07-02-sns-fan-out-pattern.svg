 1</text><text x="366" y="130" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">Email service</text><g transform="translate(468 48) scale(1)"><rect width="48" height="48" rx="5" fill="#E7157B"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="18" width="9" height="12" rx="1"/><rect x="19.5" y="18" width="9" height="12" rx="1"/><rect x="31" y="18" width="9" height="12" rx="1"/></g></g><text x="492" y="115" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">SQS queue 2</text><text x="492" y="130" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">Order service</text><g transform="translate(342 153.5) scale(1)"><rect width="48" height="48" rx="5" fill="#E7157B"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="18" width="9" height="12" rx="1"/><rect x="19.5" y="18" width="9" height="12" rx="1"/><rect x="31" y="18" width="9" height="12" rx="1"/></g></g><text x="366" y="220.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">SQS queue 3</text><text x="366" y="235.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">Inventory service</text><g transform="translate(468 147) scale(1)"><rect width="48" height="48" rx="5" fill="#ED7100"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11L32 37M24 24L15 37"/></g></g><text x="492" y="214" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">Lambda function</text><text x="492" y="229" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">real-time</text><text x="492" y="242" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">notification</text><g transform="translate(342 259) scale(1)"><rect width="48" height="48" rx="5" fill="#8C4FFF"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14L9 24L19 34M29 14L39 24L29 34"/></g></g><text x="366" y="326" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">HTTP/HTTPS</text><text x="366" y="340" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">endpoint</text><text x="366" y="355" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">webhook</text><g transform="translate(468 266) scale(1)"><rect width="48" height="48" rx="5" fill="#E7157B"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9H29L35 15V39H15Z"/><path d="M20 22H30M20 28H30M20 34H26"/></g></g><text x="492" y="333" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">Email</text><text x="492" y="348" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">direct notification</text><g transform="translate(342 372) scale(1)"><rect width="48" height="48" rx="5" fill="#E7157B"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="8" width="18" height="32" rx="3"/><path d="M22 35H26"/></g></g><text x="366" y="439" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">SMS</text><text x="366" y="454" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">mobile phone</text><rect x="19" y="493" width="540" height="64" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="289" y="513" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Fan-out use case: order placed → SNS → SQS (Payment) + SQS (Warehouse) + Lambda</text><text x="289" y="529" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">(Notification). All happen independently, decoupled, no dependencies between</text><text x="289" y="545" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">consumers.</text><path d="M94.0 231.5L186.0 231.5" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M186 231.5L178 227L178 236Z" fill="#5f6881"/><path d="M234.0 231.5L264.0 231.5L264.0 243.5L294.0 243.5" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M294 243.5L286 239L286 248Z" fill="#5f6881"/></svg>
