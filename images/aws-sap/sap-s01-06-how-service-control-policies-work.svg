<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 487 410" width="487" height="410" role="img" aria-label="How service control policies work"><rect width="487" height="410" rx="12" fill="#ffffff"/><rect x="24.5" y="14" width="98" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="73.5" y="34" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">SCP at Root</text><rect x="173" y="14" width="250" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="298" y="34" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Applies to ALL accounts / OUs below</text><rect x="25.5" y="86" width="96" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="73.5" y="106" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">SCP at OU</text><rect x="173" y="86" width="250" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="298" y="106" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Applies to that OU and its children</text><rect x="14" y="158" width="119" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="73.5" y="178" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">SCP at account</text><rect x="173" y="158" width="250" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="298" y="178" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Applies only to that account</text><rect x="93" y="210" width="301" height="50" rx="6" fill="#232F3E" stroke="#232F3E" stroke-width="1.5"/><text x="243.5" y="231" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:13px;font-weight:700;fill:#fff">EFFECTIVE PERMISSIONS = SCP allows AND</text><text x="243.5" y="248" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:13px;font-weight:700;fill:#fff">IAM policy allows</text><rect x="100" y="280" width="287" height="48" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="243.5" y="300" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Even if IAM grants AdministratorAccess,</text><text x="243.5" y="316" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">an SCP can still DENY that action.</text><rect x="97" y="348" width="293" height="48" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="243.5" y="368" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Management account: SCPs do NOT apply to</text><text x="243.5" y="384" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">it!</text><path d="M122.5 30.0L173.0 30.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M173 30L165 25.5L165 34.5Z" fill="#5f6881"/><path d="M121.5 102.0L173.0 102.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M173 102L165 97.5L165 106.5Z" fill="#5f6881"/><path d="M133.0 174.0L173.0 174.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M173 174L165 169.5L165 178.5Z" fill="#5f6881"/></svg>
