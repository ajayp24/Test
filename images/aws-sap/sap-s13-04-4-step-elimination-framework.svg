<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 481" width="786" height="481" role="img" aria-label="4-step elimination framework"><rect width="786" height="481" rx="12" fill="#ffffff"/><rect x="14" y="21.75" width="372" height="100.5" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="26" y="43.75" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">1. WRONG SERVICE CATEGORY</text><text x="30" y="67.75" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"Need to scan EC2 for CVEs" → eliminate GuardDuty,</text><text x="30" y="83.25" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Macie, Detective</text><text x="30" y="98.75" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">→ Only Inspector does vulnerability scanning</text><rect x="400" y="14" width="372" height="116" rx="8" fill="#FFF7EE" stroke="#ED7100" stroke-width="1.6"/><text x="412" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ED7100">2. WRONG PROTOCOL / COMPATIBILITY</text><text x="416" y="60" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"On-prem SMB Windows shares" → eliminate EFS (NFS</text><text x="416" y="75.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">only), FSx Lustre</text><text x="416" y="91" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">→ Only FSx for Windows File Server supports SMB +</text><text x="416" y="106.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">AD</text><rect x="14" y="144" width="372" height="100.5" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="26" y="166" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">3. VIOLATES A STATED CONSTRAINT</text><text x="30" y="190" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"MINIMUM operational overhead" → eliminate</text><text x="30" y="205.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">self-managed on EC2</text><text x="30" y="221" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">→ Prefer managed services (RDS over EC2 + MySQL)</text><rect x="400" y="144" width="372" height="100.5" rx="8" fill="#F1F9F1" stroke="#2E8B2E" stroke-width="1.6"/><text x="412" y="166" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2E8B2E">4. WRONG SCOPE / BOUNDARY</text><text x="416" y="190" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"Cross-REGION replication" → eliminate Multi-AZ</text><text x="416" y="205.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">(same Region only)</text><text x="416" y="221" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">→ Need CRR for S3, DMS cross-region, Aurora Global</text><rect x="163" y="264.5" width="460" height="202" rx="8" fill="none" stroke="#9AA5B5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="175" y="286.5" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#5f6881">Between two similar answers</text><rect x="179" y="298.5" width="190" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="274" y="318.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Managed vs self-managed</text><rect x="377" y="298.5" width="230" height="32" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="492" y="318.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Managed (if "least overhead")</text><rect x="179" y="338.5" width="190" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="274" y="358.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">More featured vs simpler</text><rect x="377" y="338.5" width="230" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="492" y="358.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Depends on the constraints</text><rect x="179" y="378.5" width="190" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="274" y="398.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Expensive vs cheaper</text><rect x="377" y="378.5" width="230" height="32" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="492" y="398.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Cheaper (if "cost-effective")</text><rect x="179" y="418.5" width="190" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="274" y="438.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Async vs sync replication</text><rect x="377" y="418.5" width="230" height="32" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="492" y="438.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Sync for strongest consistency</text></svg>
