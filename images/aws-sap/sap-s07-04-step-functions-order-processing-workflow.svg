<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 388" width="886" height="388" role="img" aria-label="Step Functions order processing workflow"><rect width="886" height="388" rx="12" fill="#ffffff"/><rect x="14" y="14" width="300" height="32" rx="6" fill="#232F3E" stroke="#232F3E" stroke-width="1.5"/><text x="164" y="34" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#fff">Order received</text><rect x="14" y="66" width="300" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="164" y="86" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Validate order</text><rect x="14" y="118" width="300" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="164" y="138" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Charge payment</text><rect x="14" y="170" width="300" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="164" y="190" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Reserve inventory</text><rect x="14" y="222" width="300" height="48" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="164" y="242" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">PARALLEL: Update ERP system + Send</text><text x="164" y="258" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">confirmation email</text><rect x="14" y="290" width="300" height="32" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="164" y="310" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Ship order</text><rect x="14" y="342" width="300" height="32" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="164" y="362" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Order complete</text><rect x="342" y="74" width="210" height="32" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="447" y="94" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Send failure notification</text><rect x="342" y="150" width="210" height="32" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="447" y="170" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Refund &amp; notify</text><rect x="580" y="14" width="292" height="178" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="592" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">State types</text><text x="596" y="60" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Task: call Lambda, ECS, SQS, Batch...</text><text x="596" y="75.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Choice: conditional branching</text><text x="596" y="91" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Parallel: execute branches</text><text x="596" y="106.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">simultaneously</text><text x="596" y="122" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Map: process each item in an array</text><text x="596" y="137.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Wait: pause for time or event</text><text x="596" y="153" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Pass: pass input to output unchanged</text><text x="596" y="168.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">Succeed / Fail: terminal states</text><path d="M164.0 46.0L164.0 66.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M164 66L159.5 58L168.5 58Z" fill="#5f6881"/><path d="M164.0 98.0L164.0 118.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M164 118L159.5 110L168.5 110Z" fill="#5f6881"/><rect x="138.7" y="99.0" width="50.6" height="18" rx="4" fill="#fff" opacity=".94"/><text x="164.0" y="110.0" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10.5px;font-weight:600;fill:#3c4660">SUCCESS</text><path d="M164.0 150.0L164.0 170.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M164 170L159.5 162L168.5 162Z" fill="#5f6881"/><rect x="138.7" y="151.0" width="50.6" height="18" rx="4" fill="#fff" opacity=".94"/><text x="164.0" y="162.0" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10.5px;font-weight:600;fill:#3c4660">SUCCESS</text><path d="M164.0 202.0L164.0 222.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M164 222L159.5 214L168.5 214Z" fill="#5f6881"/><path d="M164.0 270.0L164.0 290.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M164 290L159.5 282