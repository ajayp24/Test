l,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">stored procedures and 3</text><text x="60" y="239" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">triggers need rewriting.</text><rect x="314" y="28.5" width="315.2" height="219" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="326" y="50.5" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Phase 2: Schema conversion (1 month)</text><g transform="translate(447.6 62.5) scale(1)"><rect width="48" height="48" rx="5" fill="#01A88D"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="14" cy="15" rx="7" ry="3"/><path d="M7 15V28C7 30 10 31.5 14 31.5S21 30 21 28V15"/><ellipse cx="34" cy="26" rx="7" ry="3"/><path d="M27 26V36C27 38 30 39.5 34 39.5S41 38 41 36V26M20 22H30M27 19L30 22L27 25"/></g></g><text x="471.6" y="129.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">AWS SCT</text><text x="471.6" y="144.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">converts 85%</text><text x="471.6" y="157.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">automatically</text><text x="381.6" y="194.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">Manual rewrite: 15% complex</text><text x="381.6" y="209.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881">PL/SQL. Test in a dev</text><text x="381.6" y="224.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11px;font-weight:500;fill:#5f6881"