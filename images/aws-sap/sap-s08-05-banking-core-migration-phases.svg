formance: +30% query</text><text x="596" y="318" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">performance</text><rect x="729" y="282" width="240" height="48" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="849" y="302" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">HA: Multi-AZ automatic (was manual</text><text x="849" y="318" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Oracle Data Guard)</text><path d="M286.0 138.0L314.0 138.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M314 138L306 133.5L306 142.5Z" fill="#5f6881"/><path d="M629.2 138.0L657.2 138.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M657.2 138L649.2 133.5L649.2 142.5Z" fill="#5f6881"/><path d="M958.0 138.0L986.0 138.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M986 138L978 133.5L978 142.5Z" fill="#5f6881"/></svg>
