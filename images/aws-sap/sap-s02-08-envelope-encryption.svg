<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 360" width="548" height="360" role="img" aria-label="Envelope encryption"><rect width="548" height="360" rx="12" fill="#ffffff"/><g transform="translate(46 14) scale(1)"><rect width="48" height="48" rx="5" fill="#DD344C"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="24" r="6.5"/><path d="M22.5 24H39M33 24V30M38 24V28"/></g></g><text x="70" y="81" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">AWS KMS</text><rect x="154" y="18" width="380" height="64" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="344" y="38" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">STEP 1: Generate data encryption key (DEK)</text><text x="344" y="54" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">KMS GenerateDataKey API</text><text x="344" y="70" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Returns: plaintext DEK + encrypted DEK (under the CMK)</text><g transform="translate(46 110) scale(1)"><rect width="48" height="48" rx="5" fill="#232F3E"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="15" width="18" height="18" rx="2"/><path d="M20 15V10M28 15V10M20 38V33M28 38V33M15 20H10M15 28H10M38 20H33M38 28H33"/></g></g><text x="70" y="177" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">Application</text><rect x="154" y="106" width="380" height="80" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="344" y="126" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">STEP 2: Encrypt data</text><text x="344" y="142" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Use plaintext DEK to encrypt large data locally</text><text x="344" y="158" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Store encrypted data + encrypted DEK together</text><text x="344" y="174" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Discard plaintext DEK from memory</text><g transform="translate(46 206) scale(1)"><rect width="48" height="48" rx="5" fill="#DD344C"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="24" r="6.5"/><path d="M22.5 24H39M33 24V30M38 24V28"/></g></g><text x="70" y="273" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">AWS KMS</text><rect x="154" y="210" width="380" height="64" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="344" y="230" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">STEP 3: Decrypt</text><text x="344" y="246" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Send encrypted DEK to KMS → get plaintext DEK back</text><text x="344" y="262" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Use plaintext DEK to decrypt data locally</text><rect x="127.5" y="298" width="293" height="48" rx="6" fill="#232F3E" stroke="#232F3E" stroke-width="1.5"/><text x="274" y="318" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#fff">WHY? KMS keys never leave the HSM.</text><text x="274" y="334" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#fff">Encrypt large data locally with the DEK.</text><path d="M344.0 82.0L344.0 106.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M344 106L339.5 98L348.5 98Z" fill="#5f6881"/><path d="M344.0 186.0L344.0 210.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M344 210L339.5 202L348.5 202Z" fill="#5f6881"/></svg>
