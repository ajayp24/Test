<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 626" width="580" height="626" role="img" aria-label="Question analysis framework: 5-step process"><rect width="580" height="626" rx="12" fill="#ffffff"/><rect x="14" y="14" width="552" height="100.5" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="26" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Step 1: READ THE STEM</text><text x="30" y="60" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Identify the ACTUAL question (last sentence)</text><text x="30" y="75.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Note constraints: "most cost-effective", "LEAST operational overhead",</text><text x="30" y="91" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">"MINIMUM downtime", "MOST secure"</text><rect x="14" y="134.5" width="552" height="116" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="26" y="156.5" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Step 2: IDENTIFY KEY REQUIREMENTS</text><text x="30" y="180.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Technical constraints (latency, throughput, size)</text><text x="30" y="196" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Compliance requirements (HIPAA, PCI, GDPR)</text><text x="30" y="211.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Business constraints (budget, timeline)</text><text x="30" y="227" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Architecture requirements (HA, DR, multi-region)</text><rect x="14" y="270.5" width="552" height="100.5" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="26" y="292.5" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">Step 3: ELIMINATE WRONG ANSWERS</text><text x="30" y="316.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Find options that contradict constraints</text><text x="30" y="332" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Eliminate services that don't apply</text><text x="30" y="347.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Watch for mismatched protocols or service scopes</text><rect x="14" y="391" width="552" height="100.5" rx="8" fill="#FFF7EE" stroke="#ED7100" stroke-width="1.6"/><text x="26" y="413" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ED7100">Step 4: COMPARE REMAINING OPTIONS</text><text x="30" y="437" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Between 2 similar options: which is MORE managed?</text><text x="30" y="452.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Which has LOWER operational overhead?</text><text x="30" y="468" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Which BEST fits the stated requirement?</text><rect x="14" y="511.5" width="552" height="100.5" rx="8" fill="#F1F9F1" stroke="#2E8B2E" stroke-width="1.6"/><text x="26" y="533.5" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2E8B2E">Step 5: ANSWER AND MARK FOR REVIEW IF UNSURE</text><text x="30" y="557.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Always answer (no penalty for a wrong answer)</text><text x="30" y="573" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Flag uncertain questions for review</text><text x="30" y="588.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">• Don't change answers unless you find a clear reason</text><path d="M290.0 114.5L290.0 134.5" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M290 134.5L285.5 126.5L294.5 126.5Z" fill="#5f6881"/><path d="M290.0 250.5L290.0 270.5" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M290 270.5L285.5 262.5L294.5 262.5Z" fill="#5f6881"/><path d="M290.0 371.0L290.0 391.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M290 391L285.5 383L294.5 383Z" fill="#5f6881"/><path d="M290.0 491.5L290.0 511.5" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M290 511.5L285.5 503.5L294.5 503.5Z" fill="#5f6881"/></svg>
