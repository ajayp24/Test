<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-label="CloudTrail architecture"><rect width="720" height="424" rx="12" fill="#ffffff"/><g transform="translate(71 100.5) scale(1)"><rect width="48" height="48" rx="5" fill="#8C4FFF"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14L9 24L19 34M29 14L39 24L29 34"/></g></g><text x="95" y="167.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">API call made</text><text x="95" y="182.5" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">by any principal</text><g transform="translate(211 107) scale(1)"><rect width="48" height="48" rx="5" fill="#E7157B"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9H29L35 15V39H15Z"/><path d="M20 22H30M20 28H30M20 34H26"/></g></g><text x="235" y="174" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">CloudTrail</text><rect x="319" y="14" width="362" height="258" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="331" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Event types</text><rect x="335" y="48" width="330" height="64" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="500" y="68" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">MANAGEMENT EVENTS (control plane)</text><text x="500" y="84" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">CreateEC2, DeleteS3Bucket, AttachRolePolicy.</text><text x="500" y="100" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Enabled by default, 90 days in console</text><rect x="335" y="120" width="330" height="64" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="500" y="140" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">DATA EVENTS (data plane)</text><text x="500" y="156" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">S3:GetObject, PutObject, DynamoDB:PutItem.</text><text x="500" y="172" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Disabled by default, extra cost</text><rect x="335" y="192" width="330" height="64" rx="6" fill="#EEF3FF" stroke="#2f5be0" stroke-width="1.5"/><text x="500" y="212" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1a1f36">INSIGHTS EVENTS</text><text x="500" y="228" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Detect unusual activity: unusual API call rate or</text><text x="500" y="244" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">error rate</text><rect x="14" y="300" width="332" height="102" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="26" y="322" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Storage</text><text x="30" y="346" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Event history: 90 days free in console</text><text x="30" y="362" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Trail: send to S3 (long-term), CloudWatch</text><text x="30" y="378" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Logs, EventBridge</text><rect x="374" y="292" width="332" height="118" rx="8" fill="none" stroke="#E7157B" stroke-width="1.6" stroke-dasharray="6 4"/><g transform="translate(382 298) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#E7157B"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="18" y="9" width="12" height="9"/><rect x="8" y="30" width="12" height="9"/><rect x="28" y="30" width="12" height="9"/><path d="M24 18V24M14 30V24H34V30"/></g></g><text x="410" y="314" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#E7157B">Organization trail</text><text x="390" y="338" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">One trail for ALL accounts in the</text><text x="390" y="354" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">organization</text><text x="390" y="370" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Managed from the management account</text><text x="390" y="386" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Member accounts cannot disable it</text><path d="M119.0 124.5L165.0 124.5L165.0 131.0L211.0 131.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M211 131L203 126.5L203 135.5Z" fill="#5f6881"/><path d="M259.0 131.0L289.0 131.0L289.0 143.0L319.0 143.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M319 143L311 138.5L311 147.5Z" fill="#5f6881"/></svg>
