ate(127.6 174) scale(1)"><rect width="48" height="48" rx="5" fill="#C925D1"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="14" rx="12" ry="4.5"/><path d="M12 14V34C12 37 17 39 24 39S36 37 36 34V14M12 24C12 27 17 29 24 29S36 27 36 24"/></g></g><text x="151.6" y="241" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">RDS primary</text><text x="151.6" y="255" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">instance</text><text x="151.6" y="270" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">Engine: MySQL 8.0</text><rect x="258" y="140" width="156.8" height="149" rx="8" fill="none" stroke="#147EB4" stroke-width="1.6" stroke-dasharray="6 4"/><g transform="translate(266 146) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#147EB4"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 40C24 40 12 28 12 20a12 12 0 0 1 24 0C36 28 24 40 24 40Z"/><circle cx="24" cy="20" r="4"/></g></g><text x="294" y="162" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#147EB4">AZ: us-east-1b</text><g transform="translate(312.4 174) scale(1)"><rect width="48" height="48" rx="5" fill="#C925D1"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="14" rx="12" ry="4.5"/><path d="M12 14V34C12 37 17 39 24 39S36 37 36 34V14M12 24C12 27 17 29 24 29S36 27 36 24"/></g></g><text x="336.4" y="241" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">RDS standby</text><text x="336.4" y="255" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">instance</text><text x="336.4" y="270" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10px;fill:#5f6881">No reads, no writes</text><rect x="14" y="325" width="460" height="64" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="244" y="345" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Failover: primary fails → DNS endpoint switches to the standby.</text><text x="244" y="361" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Automatic, 60–120 seconds. The application reconnects using the same</text><text x="244" y="377" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">endpoint.</text><path d="M244.0 84.0L244.0 129.0L151.6 129.0L151.6 174.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M151.6 174L147.1 166L156.1 166Z" fill="#5f6881"/><rect x="97.1" y="120.0" width="201.4" height="18" rx="4" fill="#fff" opacity=".94"/><text x="197.8" y="131.0" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10.5px;font-weight:600;fill:#3c4660">writes / reads → primary endpoint</text><path d="M175.6 198.0L312.4 198.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M312.4 198L304.4 193.5L304.4 202.5Z" fill="#5f6881"/><path d="M175.6 198L183.6 193.5L183.6 202.5Z" fill="#5f6881"/><rect x="172.3" y="183.0" width="143.4" height="30" rx="4" fill="#fff" opacity=".94"/><text x="244.0" y="194.0" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10.5px;font-weight:600;fill:#3c4660">synchronous replication</text><text x="244.0" y="206.0" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:10.5px;font-weight:600;fill:#3c4660">(always in sync)</text></svg>
