<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 395" width="804" height="395" role="img" aria-label="Spot instance architecture"><rect width="804" height="395" rx="12" fill="#ffffff"/><rect x="14" y="14" width="230" height="48" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="129" y="34" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Normal price: $0.25/hour</text><text x="129" y="50" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">(m5.xlarge)</text><rect x="272" y="14" width="230" height="48" rx="6" fill="#EAF7EC" stroke="#2E8B2E" stroke-width="1.5"/><text x="387" y="34" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Spot price: $0.025/hour (90%</text><text x="387" y="50" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">cheaper!)</text><rect x="530" y="14" width="260" height="48" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="660" y="34" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">Interruption: 2-minute warning before</text><text x="660" y="50" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">termination (when AWS needs capacity)</text><rect x="106" y="82" width="592" height="147" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="118" y="104" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">BEST PRACTICES</text><text x="122" y="128" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">1. Spot Fleet: mix instance types across AZs: if one is interrupted, another takes</text><text x="122" y="143.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">over</text><text x="122" y="159" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">2. Mixed On-Demand + Spot ASG: baseline 20% On-Demand (stable), burst 80% Spot</text><text x="122" y="174.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">(cheap scaling)</text><text x="122" y="190" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">3. Spot with SQS: checkpoint long jobs to SQS; if interrupted, the job restarts from</text><text x="122" y="205.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">the checkpoint</text><rect x="86" y="249" width="302" height="131.5" rx="8" fill="#F1F9F1" stroke="#2E8B2E" stroke-width="1.6"/><text x="98" y="271" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2E8B2E">VALID SPOT USE CASES</text><text x="102" y="295" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">✓ Batch processing, data analytics</text><text x="102" y="310.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">✓ CI/CD build servers</text><text x="102" y="326" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">✓ ML model training</text><text x="102" y="341.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">✓ Stateless web servers (in an ASG)</text><text x="102" y="357" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">✓ Image / video rendering</text><rect x="416" y="249" width="302" height="116" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="428" y="271" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">INVALID SPOT USE CASES</text><text x="432" y="295" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">✗ Databases (stateful, need persistence)</text><text x="432" y="310.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">✗ Production single-instance web servers</text><text x="432" y="326" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">✗ Any workload that cannot be</text><text x="432" y="341.5" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:500;fill:#5f6881">interrupted</text></svg>
