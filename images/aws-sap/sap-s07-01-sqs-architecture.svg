<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 582" width="720" height="582" role="img" aria-label="SQS architecture"><rect width="720" height="582" rx="12" fill="#ffffff"/><g transform="translate(46 39) scale(1)"><rect width="48" height="48" rx="5" fill="#232F3E"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="15" width="18" height="18" rx="2"/><path d="M20 15V10M28 15V10M20 38V33M28 38V33M15 20H10M15 28H10M38 20H33M38 28H33"/></g></g><text x="70" y="106" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">Producer</text><g transform="translate(186 39) scale(1)"><rect width="48" height="48" rx="5" fill="#E7157B"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="18" width="9" height="12" rx="1"/><rect x="19.5" y="18" width="9" height="12" rx="1"/><rect x="31" y="18" width="9" height="12" rx="1"/></g></g><text x="210" y="106" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">SQS queue</text><rect x="294" y="14" width="412" height="122" rx="8" fill="none" stroke="#232F3E" stroke-width="1.6"/><g transform="translate(302 20) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#232F3E"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 35H34A7.5 7.5 0 0 0 33 20A10 10 0 0 0 15 22A6.5 6.5 0 0 0 15 35Z"/></g></g><text x="330" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#232F3E">Consumer</text><g transform="translate(342 48) scale(1)"><rect width="48" height="48" rx="5" fill="#ED7100"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="15" y="15" width="18" height="18" rx="2"/><path d="M20 15V10M28 15V10M20 38V33M28 38V33M15 20H10M15 28H10M38 20H33M38 28H33"/></g></g><text x="366" y="115" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">EC2</text><g transform="translate(476 48) scale(1)"><rect width="48" height="48" rx="5" fill="#ED7100"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11L32 37M24 24L15 37"/></g></g><text x="500" y="115" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">Lambda</text><g transform="translate(610 48) scale(1)"><rect width="48" height="48" rx="5" fill="#ED7100"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17L24 9L39 17V33L24 41L9 33Z"/><path d="M24 9V41M9 17L39 33M39 17L9 33"/></g></g><text x="634" y="115" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:11.5px;font-weight:600;fill:#1a1f36">ECS</text><rect x="108" y="164" width="218" height="102" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="120" y="186" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">Standard queue</text><text x="124" y="210" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">• At-least-once delivery</text><text x="124" y="226" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">• Best-effort ordering</text><text x="124" y="242" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">• Nearly unlimited TPS</text><rect x="354" y="156" width="258" height="118" rx="8" fill="#FFF7EE" stroke="#ED7100" stroke-width="1.6"/><text x="366" y="178" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ED7100">FIFO queue</text><text x="370" y="202" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">• Exactly-once processing</text><text x="370" y="218" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">• First-In-First-Out ordering</text><text x="370" y="234" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">• 3,000 msg/sec with batching</text><text x="370" y="250" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">• 300 msg/sec without batching</text><rect x="154" y="294" width="412" height="274" rx="8" fill="none" stroke="#9AA5B5" stroke-width="1.6" stroke-dasharray="5 4"/><text x="166" y="316" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#5f6881">Message lifecycle</text><rect x="170" y="328" width="380" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="360" y="348" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">1. Producer sends the message (max 256 KB)</text><rect x="170" y="368" width="380" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="360" y="388" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">2. Message is "in flight" once a consumer receives it</text><rect x="170" y="408" width="380" height="32" rx="6" fill="#fff" stroke="#9AA5B5" stroke-width="1.5"/><text x="360" y="428" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">3. Consumer processes it, then deletes the message</text><rect x="170" y="448" width="380" height="48" rx="6" fill="#FFF3E8" stroke="#ED7100" stroke-width="1.5"/><text x="360" y="468" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">4. Not deleted within VisibilityTimeout → message</text><text x="360" y="484" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">reappears</text><rect x="170" y="504" width="380" height="48" rx="6" fill="#FFF0F0" stroke="#D13212" stroke-width="1.5"/><text x="360" y="524" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">5. After maxReceiveCount failures → message goes to the</text><text x="360" y="540" text-anchor="middle" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#1a1f36">DLQ</text><path d="M94.0 63.0L186.0 63.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M186 63L178 58.5L178 67.5Z" fill="#5f6881"/><path d="M234.0 63.0L264.0 63.0L264.0 75.0L294.0 75.0" fill="none" stroke="#5f6881" stroke-width="1.7" stroke-linejoin="round"/><path d="M294 75L286 70.5L286 79.5Z" fill="#5f6881"/></svg>
