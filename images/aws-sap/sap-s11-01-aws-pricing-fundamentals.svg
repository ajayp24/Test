<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 684 360" width="684" height="360" role="img" aria-label="AWS pricing fundamentals"><rect width="684" height="360" rx="12" fill="#ffffff"/><rect x="14" y="14" width="656" height="332" rx="8" fill="none" stroke="#232F3E" stroke-width="1.6"/><g transform="translate(22 20) scale(0.4583333333333333)"><rect width="48" height="48" rx="5" fill="#232F3E"/><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 35H34A7.5 7.5 0 0 0 33 20A10 10 0 0 0 15 22A6.5 6.5 0 0 0 15 35Z"/></g></g><text x="50" y="36" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#232F3E">AWS pricing fundamentals</text><rect x="30" y="72" width="302" height="86" rx="8" fill="#F4F7FF" stroke="#2f5be0" stroke-width="1.6"/><text x="42" y="94" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2f5be0">1. PAY FOR WHAT YOU USE</text><text x="46" y="118" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">On-Demand: no commitment, highest price</text><text x="46" y="134" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Pay by the hour or second</text><rect x="349" y="48" width="302" height="134" rx="8" fill="#FFF7EE" stroke="#ED7100" stroke-width="1.6"/><text x="361" y="70" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#ED7100">2. PAY LESS WHEN YOU RESERVE</text><text x="365" y="94" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Reserved Instances: 1 or 3 year</text><text x="365" y="110" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">commitment</text><text x="365" y="126" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Savings Plans: 1 or 3 year $/hour</text><text x="365" y="142" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">commitment</text><text x="365" y="158" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Up to 72% discount vs On-Demand</text><rect x="30" y="196" width="302" height="134" rx="8" fill="#F1F9F1" stroke="#2E8B2E" stroke-width="1.6"/><text x="42" y="218" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#2E8B2E">3. PAY LESS BY USING MORE</text><text x="46" y="242" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">S3: tiered pricing (more GB = lower</text><text x="46" y="258" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">$/GB)</text><text x="46" y="274" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Data transfer: volume discounts</text><text x="46" y="290" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Consolidated billing: combined usage for</text><text x="46" y="306" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">discounts</text><rect x="346" y="212" width="308" height="102" rx="8" fill="#FFF3F1" stroke="#D13212" stroke-width="1.6"/><text x="358" y="234" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12.5px;font-weight:700;fill:#D13212">4. PAY EVEN LESS FOR SPARE CAPACITY</text><text x="365" y="258" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Spot Instances: up to 90% off On-Demand</text><text x="365" y="274" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">Interruptible when AWS needs capacity</text><text x="365" y="290" text-anchor="start" style="font-family:'Plus Jakarta Sans','Nunito',Arial,sans-serif;font-size:12px;font-weight:500;fill:#5f6881">back</text></svg>
